# Painel do blog (Decap CMS) — acessível em /admin
# Login via DecapBridge (PKCE). Nenhum segredo aqui: o token do GitHub fica no DecapBridge.
backend:
  name: git-gateway
  repo: JuniorMira0/legal-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/a0765b2d-ec72-4c72-a60b-81203625258d/pkce
  auth_token_endpoint: /sites/a0765b2d-ec72-4c72-a60b-81203625258d/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://guilhermequintiliano.netlify.app

locale: pt
media_folder: public/images/blog
public_folder: /images/blog

collections:
  - name: blog
    label: Artigos do Blog
    label_singular: Artigo
    folder: content/blog
    extension: md
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{category}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Data de publicação, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]", date_format: "DD/MM/YYYY", time_format: "HH:mm" }
      - label: Categoria
        name: category
        widget: select
        options: ["Consumidor", "Cível", "Trabalhista", "Viagens", "Geral"]
      - { label: Resumo (aparece na lista e no Google), name: summary, widget: text, hint: "1 ou 2 frases. Informativo, sem prometer resultados." }
      - { label: Imagem de capa, name: image, widget: image, required: false }
      - { label: Rascunho (não publicar ainda), name: draft, widget: boolean, default: false }
      - { label: Texto, name: body, widget: markdown, hint: "Lembrete OAB (Provimento 205/2021): conteúdo informativo e educativo. Sem promessa de resultado, captação de clientes ou comparação com outros advogados." }
